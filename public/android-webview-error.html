<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    />
    <title>微光漫卷 · LumiComic</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: 48px 24px;
        line-height: 1.7;
      }
      main {
        max-width: 480px;
        margin: 12vh auto;
      }
      h1 {
        font-size: 24px;
      }
      p {
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>请更新系统网页组件</h1>
      <p>
        请在手机应用商店更新 Android System WebView 或
        Chrome，然后重新打开微光漫卷。
      </p>
      <p>更新系统组件不会删除你的漫画原文件。</p>
      <section lang="en">
        <h2>Please update your system WebView</h2>
        <p>
          Update Android System WebView or Chrome in your phone’s app store,
          then reopen LumiComic. Your original comic files are kept.
        </p>
      </section>
    </main>
